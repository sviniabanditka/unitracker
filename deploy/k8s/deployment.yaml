apiVersion: v1
kind: Service
metadata:
  name: tracker
  namespace: tracker
  labels:
    app: tracker
spec:
  selector:
    app: tracker
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker
  namespace: tracker
  labels:
    app: tracker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tracker
  template:
    metadata:
      labels:
        app: tracker
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: app
          image: registry.sviniabanditka.com/tracker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: DATA_DIR
              value: /data
            - name: COOKIE_SECURE
              value: "true"
            - name: TZ
              value: Europe/Kyiv
          envFrom:
            - secretRef:
                name: tracker-env
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tracker-data
